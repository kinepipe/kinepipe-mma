[project]
name = "kinovea-ai-backend"
version = "1.0.0"
description = "Kinematic analysis backend powered by Computer Vision and AI (Sports2D, Pose2Sim, DeepLabCut, Kinovea KVA)"
authors = [{ name = "Kinepipe Biomechanics Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
